# Copiado para config/profile.yaml por `night-shift init`. O arquivo real NÃO vai para o git.

name: Seu Nome
email: voce@example.com

preferences:
  levels: [pleno, junior]            # ordem = prioridade; vaga com nível fora daqui é cortada
  work_models: [remoto, hibrido, presencial]
  contracts: [clt, pj]
  locations: [São Paulo]             # cidades aceitas para presencial/híbrido
  salary:                             # bruto mensal em R$
    pleno:
      clt_min: 6000
      # pj_min: 9000                  # se omitido, usa clt_min x 1,45
    junior:
      clt_min: 3500
  # título precisa ter ao menos uma (omitir = padrão: backend, software, python, engineer...)
  # title_keywords: [backend, python, software engineer]
  keywords: [python, fastapi, django, flask, aws, llm, ia, ai, java, spring]   # título ou descrição
  blocked_keywords: [php, .net, c#, golang, ruby, frontend, front-end, data analyst]
  stack_levels:                       # níveis aceitos por stack de CV
    python: [junior, pleno]
    ia: [junior, pleno]
    java: [junior]                    # Java só júnior
  gupy_search_terms: [python, backend python, desenvolvedor python, fastapi, engenheiro de software python]

automation:
  enabled: false                      # kill switch de qualquer submissão
  auto_apply_min_score: 85
  daily_auto_apply_limit: 10

llm:
  # claude: Claude Code CLI com o login da sua assinatura (sem API key); ordena as vagas por
  #         palavras-chave do CV. Instale com `winget install Anthropic.ClaudeCode` e rode
  #         `claude` uma vez para fazer login.
  # ollama: modelos locais (precisa do Ollama rodando + ollama pull dos dois modelos abaixo).
  provider: claude
  claude_model: haiku                 # o mais barato; usa os limites do seu plano
  time_budget_minutes: 120            # a etapa de nota para depois disso; o resto fica p/ amanhã
  rank_top_n: 30                      # vagas por noite que vão para o LLM
  # --- só para provider: ollama
  local_model: qwen3:8b               # ~5 GB de VRAM em Q4
  embed_model: bge-m3                 # multilíngue (PT + EN)
  ollama_url: http://localhost:11434
  think: false                        # raciocínio estendido do qwen3: lento e desnecessário aqui
  claude_daily_letters: 10
  claude_daily_outreach: 10          # mensagens de outreach por dia (você envia)

application:                          # night-shift apply (aplicação assistida)
  current_company: null               # campo "empresa atual"; null = deixa para você
  wait_minutes: 15                    # tempo para você conferir e enviar cada formulário
  answers:                            # respostas fixas, casadas pelo rótulo do campo (regex)
    - {pattern: "pretens|salary expectation", answer: "R$ 6.000 (CLT)"}
    - {pattern: "relocation|mudan.a de cidade", answer: "Não preciso de mudança"}
  # CPF, raça, gênero, orientação, deficiência etc. NUNCA são preenchidos, mesmo se casarem.

turn_off:
  grace_seconds: 30
  stop_ollama: false
